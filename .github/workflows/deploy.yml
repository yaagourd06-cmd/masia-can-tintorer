name: Build i desplegament

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Memòria cau de recursos (imatges i tipografies)
        uses: actions/cache@v5
        with:
          path: .cache/assets
          key: assets-${{ hashFiles('content/images.json', 'scripts/fetch-assets.mjs') }}
      - name: Recursos autoallotjats
        run: npm run assets
      - name: Build
        run: npm run build
      - name: Comprovacions (HTML, accessibilitat bàsica, enllaços)
        run: npm run check
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
